# Perfil de producción - Railway / Render
# Estas variables se configuran en el panel de Railway como variables de entorno

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dunab_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

jwt.secret=${JWT_SECRET:DunabSecretKey2024!UniversidadAutonomaBucaramanga}
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=update
logging.level.com.unab.dunab=WARN
