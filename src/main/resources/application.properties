# =============================================
#  DUNAB - Gestión de Dinero UNAB
# =============================================

spring.application.name=DUNAB
server.port=${PORT:8080}

# ---- Base de datos ----
# Railway MySQL variables
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:dunab_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Connection pool ----
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- JWT ----
jwt.secret=${JWT_SECRET:DunabSecretKey2024!UniversidadAutonomaBucaramanga#FinanceSystem@2024}
jwt.expiration=86400000

# ---- File upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Actuator health check (Railway uses this) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.unab.dunab=INFO
logging.level.org.springframework.security=WARN

# ---- Cloudinary (almacenamiento de imágenes en la nube) ----
# Registrate gratis en cloudinary.com y obtén tus credenciales
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}