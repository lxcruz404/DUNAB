<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>
(function(){
  var t=localStorage.getItem("dunab_theme")||"light";
  document.documentElement.setAttribute("data-theme",t);
  document.documentElement.style.background=t==="dark"?"#1a0a0f":"#8B1A4A";
})();
</script>
<link rel="stylesheet" href="/theme.css">
<title>DUNAB - Ranking Top 12</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:#8B1A4A;min-height:100vh}
  main{padding:28px 36px;max-width:800px;margin:0 auto}
  .card{background:#fff;border-radius:16px;padding:28px}
  .card-title{font-size:1.2rem;font-weight:700;color:#1a1a1a;margin-bottom:6px;text-align:center}
  .card-sub{text-align:center;color:#888;font-size:0.85rem;margin-bottom:24px}
  .rank-item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #f0f0f0}
  .rank-item:last-child{border-bottom:none}
  .rank-pos{width:36px;text-align:center;font-size:1.3rem;font-weight:800;color:#8B1A4A}
  .rank-pos.gold{color:#FFD700}
  .rank-pos.silver{color:#C0C0C0}
  .rank-pos.bronze{color:#CD7F32}
  .rank-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #8B1A4A}
  .rank-info{flex:1}
  .rank-name{font-weight:700;font-size:0.95rem;color:#1a1a1a}
  .rank-detail{font-size:0.78rem;color:#888}
  .rank-balance{font-size:1rem;font-weight:700;color:#E8A020}
  .you-badge{background:#fde8e8;color:#8B1A4A;padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:700;margin-left:6px}
  .empty{text-align:center;padding:40px;color:#aaa}
</style>
</head>
<body>
<div id="header-container"></div>
<div id="nav-container"></div>
<main>
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-crown"></i> Ranking Top 12 DUNAB</div>
    <div class="card-sub">Estudiantes con mayor saldo DUNAB — Período académico febrero — noviembre</div>
    <div id="ranking-list"><div class="empty">Cargando...</div></div>
  </div>
</main>
<script src="/theme.js"></script>
<script src="/api.js"></script>
<script src="/layout.js"></script>
<script>
requireAuth();
async function init() {
  const pr = await UserAPI.getProfile();
  if (pr?.data) {
    document.getElementById('header-container').innerHTML = renderHeader('Ranking Top 12','', pr.data);
    document.getElementById('nav-container').innerHTML = renderNav('ranking');
    initTheme();
  }
  const me = Auth.getUser();
  const res = await RankingAPI.getTop12();
  const list = document.getElementById('ranking-list');
  if (!res?.data || res.data.length === 0) {
    list.innerHTML = '<div class="empty">Nadie en el ranking aún</div>';
    return;
  }
  const medals = {1:'<span style="color:#FFD700;font-weight:800">1</span>',2:'<span style="color:#C0C0C0;font-weight:800">2</span>',3:'<span style="color:#CD7F32;font-weight:800">3</span>'};
  const posClass = {1:'gold',2:'silver',3:'bronze'};
  list.innerHTML = res.data.map(e => {
    const isMe = me && e.userId === me.id;
    const avatar = e.profilePhotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(e.fullName)}&background=8B1A4A&color=fff`;
    return `<div class="rank-item">
        <div class="rank-pos ${posClass[e.position]||''}">${medals[e.position]||'#'+e.position}</div>
        <img class="rank-avatar" src="${avatar}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8B1A4A&color=fff'">
        <div class="rank-info">
          <div class="rank-name">${e.fullName}${isMe?'<span class="you-badge">TÚ</span>':''}</div>
          <div class="rank-detail">${e.career||'UNAB'} · ${e.studentCode}</div>
        </div>
        <div class="rank-balance">${UI.formatDunab(e.dunabBalance)}</div>
      </div>`;
  }).join('');
  initTheme();
}
init();
</script>
</body>
</html>
